name: Build CodexLight Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-codexlight-desktop.yml"
      - "codex-light-bundle/**"
      - "codex-light-desktop/**"
      - "tests/**"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test server and desktop frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codex-light-desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: codex-light-desktop
        run: npm ci

      - name: Run Python checks
        run: |
          python3 -m py_compile \
            codex-light-bundle/codex_light_server.py \
            codex-light-bundle/codex_light_http_client.py \
            codex-light-bundle/codex_light_desktop_watcher.py \
            codex-light-bundle/codex_light.py \
            codex-light-bundle/codex_light_ble.py \
            tests/test_server_aggregation.py
          python3 -m unittest tests.test_server_aggregation

      - name: Build frontend
        working-directory: codex-light-desktop
        run: npm run build

  build:
    name: Build ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS DMG
            os: macos-latest
            bundle_args: --bundles dmg
            artifact_name: codexlight-macos-dmg
            artifact_paths: |
              codex-light-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - label: Windows EXE
            os: windows-latest
            bundle_args: --bundles nsis
            artifact_name: codexlight-windows-exe
            artifact_paths: |
              codex-light-desktop/src-tauri/target/release/bundle/nsis/*.exe
          - label: Linux executable
            os: ubuntu-22.04
            bundle_args: --bundles deb
            artifact_name: codexlight-linux
            artifact_paths: |
              codex-light-desktop/src-tauri/target/release/codex-light-desktop
              codex-light-desktop/src-tauri/target/release/bundle/deb/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codex-light-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            curl \
            file \
            patchelf

      - name: Install frontend dependencies
        working-directory: codex-light-desktop
        run: npm ci

      - name: Build desktop package
        working-directory: codex-light-desktop
        shell: bash
        run: npm run tauri -- build --ci ${{ matrix.bundle_args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish-release:
    name: Publish Release assets
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release-files

          cp release-artifacts/codexlight-macos-dmg/*.dmg release-files/
          cp release-artifacts/codexlight-windows-exe/*.exe release-files/
          find release-artifacts/codexlight-linux -type f -name "*.deb" -exec cp {} release-files/ \;

          linux_bin="$(find release-artifacts/codexlight-linux -type f -name "codex-light-desktop" -print -quit)"
          cp "$linux_bin" release-files/codex-light-desktop-linux-amd64
          chmod +x release-files/codex-light-desktop-linux-amd64

          ls -lh release-files

      - name: Compute release metadata
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            title="CodexLight ${GITHUB_REF_NAME}"
            prerelease="false"
          else
            tag="codexlight-desktop-latest"
            title="CodexLight Desktop latest"
            prerelease="true"
          fi

          {
            echo "tag=${tag}"
            echo "title=${title}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

          cat > release-notes.md <<EOF
          Automated CodexLight Desktop build.

          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assets:
          - macOS DMG
          - Windows NSIS setup EXE
          - Linux amd64 executable
          - Linux amd64 DEB
          EOF

      - name: Move rolling release tag
        if: steps.release.outputs.prerelease == 'true'
        run: |
          set -euo pipefail
          git tag -f "${{ steps.release.outputs.tag }}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${{ steps.release.outputs.tag }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          title="${{ steps.release.outputs.title }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
          else
            args=(
              release create "$tag"
              release-files/*
              --target "${GITHUB_SHA}"
              --title "$title"
              --notes-file release-notes.md
            )
            if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
